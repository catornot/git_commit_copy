[package]
name = "git_commit_copy"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
git2 = { version = "0.21.0", features = ["https", "ssh"] }
itertools = "0.15.0"
miette = { version = "7.6.0", features = ["fancy"] }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
